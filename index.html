<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NandaFlix+ | Feliz Aniversário!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CONTEÚDO DO APLICATIVO -->
    <div id="appContent" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        
        <!-- CABEÇALHO LIMPO (topo.jpg) - SEM TEXTO DUPLICADO -->
        <header class="hero-header"></header>

        <!-- BANNER CLICÁVEL (click.jpg) - ABRE O POP-UP -->
        <div class="banner-click-container" onclick="document.getElementById('aniversarioModal').style.display='flex'; document.getElementById('popupVideo').play();">
            <img src="click.jpg" alt="Clique aqui para ver a surpresa" onerror="this.style.display='none'">
        </div>

        <!-- CONTEÚDO DOS VÍDEOS QUE VEM DO JSON -->
        <div id="feed" class="tab-content active" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div id="feed-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
        </div>
    </div>

    <!-- MODAL DA FOTO GRANDE -->
    <div id="imageModal" class="image-modal">
        <img id="modalImg" src="foto-de-voces.jpg" alt="Foto Ampliada">
        <button class="close-modal-btn" onclick="fecharModalFoto()">Fechar</button>
    </div>

    <!-- POP-UP DE ANIVERSÁRIO -->
    <div id="aniversarioModal" class="aniversario-modal">
        <div class="aniversario-modal-content">
            <h2>🎉 É HOJE! Feliz Aniversário, Nanda! 💜</h2>
            <video id="popupVideo" src="01.mp4" controls controlsList="nodownload"></video>
            <button class="fechar-popup-btn" onclick="document.getElementById('aniversarioModal').style.display='none'; document.getElementById('popupVideo').pause();">Assistir o resto do app</button>
        </div>
    </div>

    <!-- BOTÃO FLUTUANTE DE VOLTAR AO TOPO -->
    <button id="btnTopo" onclick="voltarAoTopo()" title="Voltar ao topo">↑</button>

    <script src="app.js"></script>
</body>
</html>
